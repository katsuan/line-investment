<!DOCTYPE html>
<html lang="ja" data-ls-dark="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>投資情報共有</title>
    <meta name="description" content="LINE の投資グループで注目した銘柄の一覧と実績を見られます。" />
    <meta name="theme-color" content="#eef3f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121615" media="(prefers-color-scheme: dark)" />
    <!-- グループの中だけで使う画面なので、検索には出さない -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Q キット（おくるんの共通部品）。色と字は styles.css の :root で、この画面の色に -->
    <link rel="stylesheet" href="https://katsuan.github.io/line-share/shared/ui.css" />
    <link rel="stylesheet" href="./styles.css?v=202610231" />
    <script src="https://katsuan.github.io/line-share/shared/ui.js" defer></script>
    <script src="./config.js"></script>
    <script>
      (function() {
        // 手元の設定（config.local.js。git に入れない）は、手元で開いたときだけ読む
        if (['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) < 0) return;
        var script = document.createElement('script');
        script.src = './config.local.js';
        script.onerror = function() {};
        document.head.appendChild(script);
      })();
    </script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  </head>
  <body>
    <main class="ls-page ls-stack">
      <header class="ls-brand">
        <h1 class="ls-brand-name"><span class="brand-icon" aria-hidden="true">📈</span>投資情報共有</h1>
      </header>
      <p class="ls-brand-copy">グループの注目銘柄を、みんなで見る</p>

      <!-- LINE の外で開いたとき・グループから開いていないとき（エラーにせず、できることを出す） -->
      <section id="outsideNote" class="ls-panel outside-note" hidden>
        <p id="outsideText" class="ls-hint"></p>
        <div class="ls-actions outside-actions">
          <button id="loginButton" class="ls-button is-primary" type="button" hidden>🔑 ログインして見る</button>
          <a id="openInLineLink" class="ls-button" href="#" hidden>💬 LINE アプリで開く</a>
        </div>
      </section>

      <div class="ls-tabs" role="tablist" aria-label="画面の切りかえ">
        <button class="ls-tab" id="tab-search" type="button" role="tab" data-view="search" aria-controls="panel-search" aria-selected="true">🔍 しらべる</button>
        <button class="ls-tab" id="tab-watchlist" type="button" role="tab" data-view="watchlist" aria-controls="panel-watchlist" aria-selected="false">📋 注目一覧</button>
        <button class="ls-tab" id="tab-performance" type="button" role="tab" data-view="performance" aria-controls="panel-performance" aria-selected="false">🏆 実績</button>
      </div>

      <section id="panel-search" class="ls-panel panel" data-panel="search" role="tabpanel" aria-labelledby="tab-search">
        <h2 class="ls-panel-title">🔍 銘柄をしらべる</h2>
        <label class="ls-field">
          <span class="ls-label">銘柄コード</span>
          <input id="tickerInput" class="ls-input" type="text" placeholder="例：7203・AAPL・212A" maxlength="12"
            autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search" aria-describedby="tickerError" />
        </label>
        <p id="tickerError" class="ls-hint is-error" hidden>銘柄コードを入れてね</p>
        <!-- 注目中の銘柄は、押すだけで入る（C4） -->
        <div id="recentWrap" class="recent" hidden>
          <p class="ls-label">注目中から選ぶ</p>
          <div id="recentChips" class="ls-chips"></div>
        </div>
        <p id="searchWatchState" class="ls-hint" hidden></p>
        <p id="sendNote" class="ls-hint send-note"></p>
        <div class="ls-actions search-actions">
          <button id="fetchQuoteButton" class="ls-button" type="button">🔍 株価を見る</button>
          <button id="sendTickerButton" class="ls-button is-primary" type="button">💬 グループに送る</button>
        </div>
        <p id="searchStatus" class="ls-hint" role="status" aria-live="polite"></p>
        <div id="quotePreview" class="card-list"></div>
      </section>

      <section id="panel-watchlist" class="ls-panel panel" data-panel="watchlist" role="tabpanel" aria-labelledby="tab-watchlist" hidden>
        <div class="panel-head-row">
          <h2 class="ls-panel-title">📋 注目一覧</h2>
          <button class="ls-button is-small" data-reload-view="watchlist" type="button">↻ 新しくする</button>
        </div>
        <p id="watchlistLoading" class="ls-hint" role="status" aria-live="polite"></p>
        <div id="watchlistContent" class="card-list"></div>
      </section>

      <section id="panel-performance" class="ls-panel panel" data-panel="performance" role="tabpanel" aria-labelledby="tab-performance" hidden>
        <div class="panel-head-row">
          <h2 class="ls-panel-title">🏆 注目の実績</h2>
          <button class="ls-button is-small" data-reload-view="performance" type="button">↻ 新しくする</button>
        </div>
        <p id="performanceLoading" class="ls-hint" role="status" aria-live="polite"></p>
        <div id="performanceContent" class="card-list"></div>
      </section>

      <!-- 手元で確かめるときだけ出す（?debug=1 か config.local.js の debugGroupId） -->
      <p id="debugContextRow" class="debug-row" hidden>
        <span id="contextBadge" class="badge">-</span>
        <span id="groupBadge" class="badge">group: -</span>
        <span id="userBadge" class="badge">user: -</span>
      </p>
    </main>

    <div id="quoteModal" class="ls-sheet" hidden>
      <div class="ls-sheet-card quote-sheet" role="dialog" aria-modal="true" aria-labelledby="quoteModalTitle">
        <p id="quoteModalTitle" class="ls-sheet-title">銘柄の情報</p>
        <p id="quoteModalStatus" class="ls-hint" role="status" aria-live="polite"></p>
        <div id="quoteModalContent" class="card-list"></div>
        <button id="quoteModalClose" class="ls-button is-block" type="button">閉じる</button>
      </div>
    </div>

    <script src="./app.js?v=202610232" defer></script>
  </body>
</html>
